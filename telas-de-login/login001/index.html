<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"> 
    <link rel="stylesheet" href="estilos/estilo.css">
    <title> Tela de login </title>
</head>
<body>
    <main id="container">
        <form id="login-form">
            <div id="form-header">
                <h1>login</h1>
                <i id="mode-icon" class="fa-solid fa-moon"></i>
            </div>
            <div id="social-media">
                <a href="#"><img src="imagens/icons8-facebook-novo-48.png" alt="faceboock logo"></a>

                <a href="#"><img src="imagens/icons8-google-logo-48.png" alt="google-logo"></a>

                <a href="#"><img src="imagens/icons8-github-30.png" alt="github-logo"></a>
            </div>
            <div id="inputs">
                <div class="input-box">
                    <label for="name">
                        name
                        <div class="input-field">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="name" name="name">
                        </div>
                    </label>
                </div>
                <div class="input-box">
                    <label for="email">
                        E-mail
                        <div class="input-field">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" name="email">
                        </div>
                    </label>
                </div>
                <div class="input-box">
                    <label for="Senha">
                        Senha
                        <div class="input-field">
                            <i id="senha" class="fa-solid fa-key"></i>
                            <input type="password" id="Senha" name="Senha">
                        </div>
                    </label>
                    <div id="forgot-passoword">
                        <a href="#">Forgot your password?</a>
                    </div>
                </div>
            </div>
            <button type="submit" id="login-button"> 
                login
            </button>
        </form>
    </main>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
